services:
  - type: web
    name: mapreko-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node --env-file-if-exists=.env node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js && npm run start:prod
    healthCheckPath: /api/auth/config
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
